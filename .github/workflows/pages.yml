name: Build WASM dynamics and publish GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Publish the default branch, or a branch selected for a manual run.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install CPU reference and export dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r python/requirements.txt
      - name: Export real checkpoint weights and saved tasks
        run: python python/export_browser.py
      - name: Validate NumPy dynamics against original PyTorch
        run: |
          python -m pytest python/tests -q
          python python/validate_browser.py
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Stage WASM and validate actual WASM inference
        working-directory: web
        run: |
          npm run prepare:wasm
          npm test
          npm run test:wasm
      - name: Build deployment with repository or custom-domain base path
        working-directory: web
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Install Chromium for static deployment smoke test
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test published frontend without a backend
        working-directory: web
        env:
          TEST_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run test:browser
      - name: Upload validation reports
        uses: actions/upload-artifact@v7
        with:
          name: wasm-validation
          path: validation/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
